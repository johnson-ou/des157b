<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    
    <title>Check Yourself | Johnson Ou</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=Share+Tech+Mono&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- background gradient layers -->
    <div class="bg-layer bg-morning"></div>
    <div class="bg-layer bg-midday"></div>
    <div class="bg-layer bg-evening"></div>
    <div class="bg-layer bg-night"></div>
    <div class="bg-layer bg-late-night"></div>

    <!-- sky decorations  -->
    <div id="sky-decor">
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div id="stars"></div>
    </div>

    <div id="container">

        <div id="clock-section">
            <div id="clock">--:--</div>
            <div id="activity">loading...</div>
        </div>
        <div id="now-playing">
            <div id="album-art"></div>
            <div id="song-info">
                <div id="song-title">Song Title</div>
                <div id="artist">Artist</div>
            </div>
            <div id="controls">
                <button id="prev-btn">⏮</button>
                <button id="play-btn">⏸</button>
                <button id="next-btn">⏭</button>
            </div>
        </div>

    </div>

</body>

</html>
